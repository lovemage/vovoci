name: site-deploy

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: creds
        shell: bash
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping site deploy."
            echo "ready=false" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Deploy site to Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: npx --yes wrangler@4.162.0 deploy --message "site-deploy ${GITHUB_SHA::7}"

      - name: Verify live site
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          expected="$(grep -o 'Latest version: <strong>v[0-9.]*</strong>' site/index.html)"
          for attempt in 1 2 3 4 5 6; do
            live="$(curl -fsS "https://vovoci.com/?deploy=${GITHUB_RUN_ID}-${attempt}" | grep -o 'Latest version: <strong>v[0-9.]*</strong>' || true)"
            if [[ "${live}" == "${expected}" ]]; then
              echo "Live site matches: ${live}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Live site shows '${live}', expected '${expected}'."
          exit 1
