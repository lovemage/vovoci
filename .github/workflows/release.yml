name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (for example 0.1.7; defaults to APP_VERSION)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          app_version="$(python -c 'import ast; tree=ast.parse(open("app.py", encoding="utf-8").read()); print(next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "APP_VERSION" for t in n.targets)))')"
          requested="${{ inputs.release_version }}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            requested="${GITHUB_REF_NAME#v}"
          fi
          version="${requested:-$app_version}"
          version="${version#v}"
          if [[ "${version}" != "${app_version}" ]]; then
            echo "Requested version ${version} does not match APP_VERSION ${app_version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Run unit tests and syntax checks
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python -m compileall -q app.py platforms tests

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          powershell -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1 -Version $version -PortableOnly
          Copy-Item ".\release\VOVOCI-portable-$version.zip" (Join-Path $env:RUNNER_TEMP "VOVOCI-portable-$version.zip") -Force

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          powershell -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1 -Version $version
          Copy-Item (Join-Path $env:RUNNER_TEMP "VOVOCI-portable-$version.zip") ".\release\VOVOCI-portable-$version.zip" -Force
          if (-not (Test-Path ".\release\VOVOCI-Setup-$version.exe")) { throw "Windows installer missing." }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/VOVOCI-Setup-${{ needs.validate.outputs.version }}.exe
            release/VOVOCI-portable-${{ needs.validate.outputs.version }}.zip
          if-no-files-found: error

  macos:
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build unsigned app and DMG
        run: |
          version="${{ needs.validate.outputs.version }}"
          ./scripts/build_macos_app.sh --python python3 --venv .venv-build --version "${version}"
          ./scripts/build_dmg.sh --version "${version}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/VOVOCI-macOS-${{ needs.validate.outputs.version }}-unsigned.dmg
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libportaudio2 libx11-6 libxtst6 xdotool

      - name: Build Linux executable bundle
        run: |
          bash ./scripts/build_linux_app.sh --python python3 --venv .venv-build --version "${{ needs.validate.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/VOVOCI-Linux-${{ needs.validate.outputs.version }}-x86_64.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: VOVOCI v${{ needs.validate.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
