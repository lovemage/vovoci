name: windows-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.1.5"
        required: true
        type: string
      notes:
        description: "GitHub Release notes"
        required: false
        default: "Windows installer release"
        type: string
  push:
    tags:
      - "v*"

jobs:
  build-and-release-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}".Trim()
          } else {
            $version = "${{ github.ref_name }}".TrimStart([char]"v")
          }
          if (-not $version) {
            throw "Version is required."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Verify source version
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $actual = python -c "import app; print(app.APP_VERSION)"
          if ($actual.Trim() -ne $expected) {
            throw "APP_VERSION is $actual, expected $expected."
          }

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          powershell -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1 -Version $version -PortableOnly
          $zip = ".\release\VOVOCI-portable-$version.zip"
          if (-not (Test-Path $zip)) {
            throw "Portable ZIP not found: $zip"
          }
          Copy-Item $zip (Join-Path $env:RUNNER_TEMP "VOVOCI-portable-$version.zip") -Force

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          powershell -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1 -Version $version
          $installer = ".\release\VOVOCI-Setup-$version.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer not found: $installer"
          }
          Copy-Item (Join-Path $env:RUNNER_TEMP "VOVOCI-portable-$version.zip") ".\release\VOVOCI-portable-$version.zip" -Force

      - name: Verify artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Test-Path ".\release\VOVOCI-Setup-$version.exe"
          Test-Path ".\release\VOVOCI-portable-$version.zip"
          if (-not (Test-Path ".\release\VOVOCI-Setup-$version.exe")) { exit 1 }
          if (-not (Test-Path ".\release\VOVOCI-portable-$version.zip")) { exit 1 }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VOVOCI-Windows-${{ steps.version.outputs.version }}
          path: |
            release/VOVOCI-Setup-${{ steps.version.outputs.version }}.exe
            release/VOVOCI-portable-${{ steps.version.outputs.version }}.zip
          retention-days: 14

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_REPO_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw "Missing PACKAGING_REPO_TOKEN secret. Create a token that can write releases to lovemage/vovoci-packaging."
          }

          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ steps.version.outputs.tag }}"
          $repo = "lovemage/vovoci-packaging"
          $title = "VOVOCI v$version"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $notes = @'
${{ github.event.inputs.notes }}
'@
          } else {
            $notes = "Windows installer release"
          }

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title $title --notes $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload $tag `
            ".\release\VOVOCI-Setup-$version.exe" `
            ".\release\VOVOCI-portable-$version.zip" `
            --repo $repo `
            --clobber
